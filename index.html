<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const theme = localStorage.getItem('portfolio-theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch {
        // Visitors with storage disabled can still use their system theme.
      }
    </script>
    <meta
      name="description"
      content="John Dinh is a senior full stack engineer building React and TypeScript interfaces, internal platforms, and backend integrations. Explore selected work and download his resume."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://johndinh.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="John Dinh — Senior Full Stack Engineer" />
    <meta
      property="og:description"
      content="React, TypeScript, Node.js, and PHP/Drupal development. Projects, experience, and resume."
    />
    <meta property="og:url" content="https://johndinh.dev/" />
    <meta property="og:image" content="https://johndinh.dev/images/john-dinh.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>John Dinh — Senior Full Stack Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript
      >John Dinh — Senior Full Stack Engineer. View the
      <a href="/resume/John-Dinh-Resume.pdf">resume</a> or email
      <a href="mailto:john@johndinh.dev">john@johndinh.dev</a>.</noscript
    >
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
